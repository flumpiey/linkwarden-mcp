# Manual pre-release steps (do these before creating a GitHub Release):
#
# 1. Bump version in ALL of:
#      - pyproject.toml
#      - server.json
#      - mcpb/manifest.json
#      - .cursor-plugin/plugin.json
# 2. Commit the version bump
# 3. Tag and push:
#      git tag v0.1.0
#      git push origin v0.1.0
# 4. Create a GitHub Release from that tag (Publishing the release triggers this workflow)
#
# PyPI: trusted publisher OIDC (no PYPI_TOKEN secret). Requires GitHub environment "pypi"
# and a pending/trusted publisher on https://pypi.org for flumpiey/linkwarden-mcp + publish.yml.
# MCP Registry: published via mcp-publisher github-oidc after PyPI upload.

name: publish

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build tools
        run: pip install build twine
      - name: Build
        run: python -m build
      - name: Check
        run: twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/linkwarden-mcp
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher
      - name: Publish to MCP Registry
        run: |
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
