[project]
name = "linkwarden-mcp"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Dru Connold", email = "dru@connold.co.za" }
]
requires-python = ">=3.13"
dependencies = [
    "fastmcp>=3.4.5",
    "httpx>=0.28.1",
]

[build-system]
requires = ["uv_build>=0.11.27,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "hatch>=1.17.1",
    "hatchling>=1.31.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "respx>=0.23.1",
    "ruff>=0.16.1",
]

[project.scripts]
linkwarden-mcp = "linkwarden_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/linkwarden_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"